[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api-detective"
version = "0.1.0-alpha.2"
description = "Open-Source Agentic API Debugging & Repair Toolkit"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [
  { name = "API Detective Contributors" }
]
keywords = ["api", "diagnostics", "debugging", "openapi", "agent", "cli", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
  "fastapi>=0.109.0",
  "uvicorn>=0.27.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.1.0",
  "sqlalchemy>=2.0.25",
  "alembic>=1.13.0",
  "httpx>=0.26.0",
  "tenacity>=8.2.3",
  "pyyaml>=6.0.1",
  "structlog>=24.1.0",
  "typer>=0.9.0",
  "rich>=13.7.0",
  "jsonschema>=4.21.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.2.0",
  "mypy>=1.8.0",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
api-detective = "cli.api_detective.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests"]
pythonpath = [".", "backend"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "cli", "skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S104", "S112", "S603", "B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["venv", ".venv", "build", "dist", "frontend"]
