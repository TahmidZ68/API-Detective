name: Feature or Diagnostic Rule Request
description: Propose a new diagnostic check, client adapter, or workflow improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      options:
        - New Deterministic Diagnostic Check
        - Repository Client Library Adapter
        - Agent Planning / Repair Capability
        - CLI Enhancement
        - Web Dashboard UX
        - Documentation / Examples
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What API integration failure or developer pain point does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution & Evidence Requirements
      description: Describe how the diagnostic or feature should work deterministically without false certainty.
    validations:
      required: true
