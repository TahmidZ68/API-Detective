name: Public Alpha Release Packaging

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release-artifacts:
    name: Build Python Wheel, Sdist & Agensi Skill ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build Python Package & Agensi Skill ZIP
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -c "import zipfile, pathlib; root = pathlib.Path('skills/api-detective'); out = pathlib.Path('dist/API-Detective-Agensi-Skill.zip'); zf = zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED); [zf.write(p, p.relative_to(root).as_posix()) for p in sorted(root.rglob('*')) if p.is_file() and '__pycache__' not in p.parts and not p.name.endswith('.pyc')]; zf.close()"

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-detective-release-artifacts
          path: dist/*
