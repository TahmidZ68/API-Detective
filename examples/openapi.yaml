openapi: 3.0.3
info:
  title: Orders & Payments Platform API
  version: 1.2.0
  description: Reference OpenAPI specification for API Detective diagnostics.
servers:
  - url: https://api.orders.example.com/v1
paths:
  /orders:
    get:
      summary: List customer orders
      operationId: listOrders
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: customer_id
          in: query
          required: true
          schema:
            type: string
      security:
        - BearerAuth: ["read:orders"]
      responses:
        "200":
          description: Paginated order list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
    post:
      summary: Create a new order
      operationId: createOrder
      parameters:
        - name: X-Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      security:
        - BearerAuth: ["write:orders"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /legacy/orders:
    get:
      summary: Legacy v0 orders endpoint
      deprecated: true
      responses:
        "200":
          description: Legacy response
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required:
        - customer_id
        - amount
        - currency
      properties:
        customer_id:
          type: string
        amount:
          type: number
        currency:
          type: string
          enum: ["USD", "EUR", "GBP"]
    Order:
      type: object
      required:
        - id
        - customer_id
        - amount
        - status
      properties:
        id:
          type: string
        customer_id:
          type: string
        amount:
          type: number
        status:
          type: string
          enum: ["pending", "paid", "failed"]
    OrderListResponse:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        total:
          type: integer
