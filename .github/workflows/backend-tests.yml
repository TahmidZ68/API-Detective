name: Backend Tests, Ruff & MyPy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Python 3.12 Backend & Benchmark Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: ruff check backend cli skills tests

      - name: Run MyPy Static Type Checker
        run: mypy --config-file pyproject.toml backend cli

      - name: Run Pytest (Unit, Security, CLI & 25-Scenario Benchmark)
        run: pytest backend/tests tests -v --junitxml=pytest-report.xml

      - name: Upload Pytest JUnit Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-pytest-report
          path: pytest-report.xml
