services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-detective-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:///./data/api_detective.db
      - BLOCK_PRIVATE_NETWORKS=true
      - ALLOW_LOCALHOST_TARGETS=false
      - REDACT_SECRETS=true
      - LLM_PROVIDER=${LLM_PROVIDER:-none}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_API_KEY=${LLM_API_KEY:-}
    volumes:
      - api_detective_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: api-detective-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  api_detective_data:
