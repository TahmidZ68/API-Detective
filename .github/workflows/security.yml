name: Security & Secret Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-audit:
    name: Dependency, Secret & Security Rule Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies and pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pip-audit

      - name: Run Ruff Bandit Security Rules (S)
        run: ruff check --select S backend cli skills

      - name: Verify Zero Committed Secrets or Private Keys
        run: |
          python -c "
          import pathlib, re, sys
          root = pathlib.Path('.')
          pattern = re.compile(r'(-----BEGIN [A-Z ]*PRIVATE KEY-----|sk-live-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})')
          ignored = {'.git', '.venv', 'node_modules', 'tests', 'backend/tests', 'docs'}
          for p in root.rglob('*'):
              if not p.is_file() or any(part in ignored for part in p.parts):
                  continue
              if 'test_' in p.name or p.suffix in ('.png', '.zip', '.db'):
                  continue
              text = p.read_text(encoding='utf-8', errors='ignore')
              if pattern.search(text):
                  print(f'Potential secret detected in {p}', file=sys.stderr)
                  sys.exit(1)
          print('Secret scan passed cleanly.')
          "

      - name: Run Dedicated SSRF, Redaction & Repair Security Tests
        run: pytest backend/tests/test_security_and_agent.py -v
